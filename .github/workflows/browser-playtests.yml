name: Browser playtests
on:
  push:
    branches: [qa/browser-playtests]
permissions:
  contents: read
jobs:
  arcade-cup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Play Cup rounds, retry a loss, resume and clear the boss
        run: |
          node --test qa/arcade-cup.cjs qa/finish-replay.cjs qa/bell-break.cjs qa/fight-records.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/cup-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/arcade-cup.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/saved-games.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/finish-replay.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/bell-break.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/fight-records.js
  sound-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Render the score and play its match transitions
        run: |
          node --test qa/score.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/audio-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/score.js
  first-fight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d0f8e49ed0bfe1d7e1111175153cea9a98d069b3
          path: baseline
          persist-credentials: false
      - name: Play all lessons and measure menu and match timing
        run: |
          node --test qa/fight-school.cjs qa/layouts.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/school-http.log" 2>&1 &
          game_pid=$!
          python3 -m http.server 8081 --bind 127.0.0.1 --directory baseline/docs > "$RUNNER_TEMP/base-http.log" 2>&1 &
          base_pid=$!
          trap 'kill "$game_pid" "$base_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/first-fight.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/layouts.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/coats.js
  combo-practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test the candidate in desktop and phone Chromium
        run: |
          node --test qa/haymaker.cjs qa/defend-takes.cjs qa/boost-grabs.cjs qa/get-up.cjs qa/crawl.cjs qa/practice-position.cjs qa/ceiling-tech.cjs qa/ledge-patience.cjs qa/attack-press.cjs qa/jump-power.cjs qa/platform-pass.cjs qa/rapid-jab.cjs qa/low-launch.cjs qa/last-dodge.cjs qa/interrupted-return.cjs qa/shield-landing.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/game-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/combo-browser.cjs
  stock-sets:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Play solo and WebRTC sets on the hosted runner
        run: |
          node --test qa/match-cards.cjs qa/stage-forms.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1 peer@1.0.2
          export NODE_PATH="$RUNNER_TEMP/df3/node_modules"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/set-http.log" 2>&1 &
          http_pid=$!
          node -e "require('peer').PeerServer({host:'127.0.0.1',port:9001,path:'/df3'})" > "$RUNNER_TEMP/set-peer.log" 2>&1 &
          peer_pid=$!
          trap 'kill "$http_pid" "$peer_pid"' EXIT
          node qa/stock-sets.cjs
