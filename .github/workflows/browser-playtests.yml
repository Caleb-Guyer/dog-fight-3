name: Browser playtests
on:
  push:
    branches: [qa/browser-playtests]
permissions:
  contents: read
jobs:
  cup-frame-times:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a2349c8355b2207a6c4687d609d9bd72ca6260f1
          path: before-canvas-sizing
          persist-credentials: false
      - name: Compare the opening Cup fight on a throttled phone
        run: |
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/current-http.log" 2>&1 &
          current_pid=$!
          python3 -m http.server 8081 --bind 127.0.0.1 --directory before-canvas-sizing/docs > "$RUNNER_TEMP/previous-http.log" 2>&1 &
          previous_pid=$!
          trap 'kill "$current_pid" "$previous_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/cup-frame-times.js
  cup-full-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Play Pip's Cup with controller inputs and resume after round one
        run: |
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/cup-full-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/cup-full-run.js
  stage-select:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Scout moving arenas with controller, keyboard and touch
        run: |
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/arena-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/stage-select.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/shared-roster.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/result-board.js
      - name: Keep the stage select screens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arena-select
          path: |
            arena-select-*.png
            scoreboard-*.png
            shared-*.png
          retention-days: 3
  event-matches:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Play the five events and race both matchup dogs on an arena route
        run: |
          node --test qa/solo-events.cjs qa/stage-run.cjs qa/light-shield.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/events-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/solo-events.js
  recovery-coach:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Revisit a recorded fall and land onstage with the original stock
        run: |
          node --test qa/recovery-coach.cjs qa/ledge-replay.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/coach-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/recovery-coach.js
  rival-footwork:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Dodge Haymaker, punish the recovery and catch the Rival stepping in
        run: |
          node --test qa/dash-back.cjs qa/stock-pressure.cjs qa/ground-space.cjs qa/dash-up-smash.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/footwork-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/dash-back.js
  menu-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Navigate welcome, fighter select, options and the arena grid
        run: |
          node --test qa/menu-navigation.cjs qa/fighter-preview.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/menu-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/menu-navigation.js
          node --test qa/ledge-scout.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/ledge-scout.js
          node --test qa/ledge-guards.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/ledge-guards.js
          node --test qa/special-studies.cjs qa/aerial-landings.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/special-studies.js
          node --test qa/fighter-tryouts.cjs qa/disc-range.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/fighter-tryouts.js
          node --test qa/high-return.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/high-return.js
          node --test qa/throw-chase.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/throw-chase.js
          node --test qa/throw-reads.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/throw-reads.js
          node --test qa/hit-confirm.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/hit-confirm.js
      - name: Keep desktop and phone fighter select screens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: versus-picker
          path: versus-*.png
          retention-days: 3
  night-mail:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Play the second chapter on ultrawide and phone
        run: |
          node --test qa/night-mail.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/story-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/night-mail.js
          node --test qa/suspend-mission.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/suspend-mission.js
          node --test qa/dead-letter-lift.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/dead-letter-lift.js
  fight-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f818ae42d59c605a19b69b4dabab76df7c103ce7
          path: previous
          persist-credentials: false
      - name: Verify fighter pixels and measure match rendering
        run: |
          DF3_ART_REFERENCE=previous/docs/fighters-art.js node --test qa/fighter-pixels.cjs
          node --test qa/stock-calls.cjs qa/fight-camera.cjs qa/fighter-entrances.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/render-http.log" 2>&1 &
          game_pid=$!
          python3 -m http.server 8081 --bind 127.0.0.1 --directory previous/docs > "$RUNNER_TEMP/reference-http.log" 2>&1 &
          previous_pid=$!
          trap 'kill "$game_pid" "$previous_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/fight-render.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/stock-calls.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/fight-camera.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/fighter-entrances.js
      - name: Keep match opening frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: entrance-frames
          path: entrance-*.png
          retention-days: 3
      - name: Keep both camera angles from the same ledge exchange
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: camera-frames
          path: fight-camera-*.png
          retention-days: 3
      - name: Keep knockout playtest frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knockout-frames
          path: stock-calls-*.png
          retention-days: 3
  cold-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 19b3d18a04ac8b88e7633ec55cd2b4a5ef81a341
          path: previous
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f70d30b411e5a321a2ffdd9278668f000f687cba
          path: prior-release
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 56d95af779ec563a8f6b04244e00592193077de7
          path: before-first-press
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f3fd50ce02e9887d675653b92fe608efa8f34e24
          path: before-continue
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 136623803ae037ef0a2c7f1f9f887738ef2a2e96
          path: before-runtime
          persist-credentials: false
      - name: Rebuild the browser scripts and compare a mixed-version rollback replay
        run: |
          npm ci --prefix tools --no-audit --no-fund --ignore-scripts
          npm run check --prefix tools
          node --test qa/runtime-parity.cjs
      - name: Compare first movement on a cold phone visit and play through a mission load retry
        run: |
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/cold-start.js
  arcade-cup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Play Cup rounds, retry a loss, resume and clear the boss
        run: |
          node --test qa/arcade-cup.cjs qa/depot-wave.cjs qa/depot-doubles.cjs qa/finish-replay.cjs qa/finish-moments.cjs qa/bell-break.cjs qa/fight-records.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/cup-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/arcade-cup.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/depot-practice.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/depot-doubles.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/saved-games.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/finish-replay.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/bell-break.js
          node --test qa/parcel-punt.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/parcel-punt.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/fight-records.js
          node --test qa/full-match.cjs
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/full-match.js
      - name: Save arcade screen previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arcade-screens
          path: |
            cup-*.png
            result-*.png
          retention-days: 5
  sound-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Render the score and play its match transitions
        run: |
          node --test qa/score.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/audio-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/score.js
  first-fight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d0f8e49ed0bfe1d7e1111175153cea9a98d069b3
          path: baseline
          persist-credentials: false
      - name: Play all lessons and measure menu and match timing
        run: |
          node --test qa/fight-school.cjs qa/rematch-film.cjs qa/fighter-lessons.cjs qa/layouts.cjs qa/pad-feedback.cjs qa/couch-select.cjs qa/winner-stays.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/school-http.log" 2>&1 &
          game_pid=$!
          python3 -m http.server 8081 --bind 127.0.0.1 --directory baseline/docs > "$RUNNER_TEMP/base-http.log" 2>&1 &
          base_pid=$!
          trap 'kill "$game_pid" "$base_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/winner-stays.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/first-fight.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/guided-school.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/fighter-lessons.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/layouts.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/coats.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/couch-select.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/stage-strike.js
  combo-practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test the candidate in ${{ matrix.device }} Chromium
        run: |
          node --test qa/haymaker.cjs qa/defend-takes.cjs qa/boost-grabs.cjs qa/get-up.cjs qa/crawl.cjs qa/practice-position.cjs qa/ceiling-tech.cjs qa/ledge-patience.cjs qa/attack-press.cjs qa/jump-power.cjs qa/platform-pass.cjs qa/rapid-jab.cjs qa/low-launch.cjs qa/last-dodge.cjs qa/interrupted-return.cjs qa/shield-landing.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/game-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/combo-browser.cjs "${{ matrix.device }}"
  stock-sets:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 223d9cd62d50343de027055a5b01d164e574a840
          path: previous
          sparse-checkout: docs/online.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Play solo and WebRTC sets on the hosted runner
        run: |
          DF3_LEGACY_ONLINE=previous/docs/online.js node --test qa/match-cards.cjs qa/stage-forms.cjs qa/room-counterpicks.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1 peer@1.0.2
          export NODE_PATH="$RUNNER_TEMP/df3/node_modules"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/set-http.log" 2>&1 &
          http_pid=$!
          node -e "require('peer').PeerServer({host:'127.0.0.1',port:9001,path:'/df3'})" > "$RUNNER_TEMP/set-peer.log" 2>&1 &
          peer_pid=$!
          trap 'kill "$http_pid" "$peer_pid"' EXIT
          node qa/stock-sets.cjs
  time-battle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Play a full timed room on desktop and touch
        run: |
          node --test qa/time-battle.cjs qa/online-warmup.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1 peer@1.0.2
          export NODE_PATH="$RUNNER_TEMP/df3/node_modules"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/time-http.log" 2>&1 &
          http_pid=$!
          node -e "require('peer').PeerServer({host:'127.0.0.1',port:9001,path:'/df3'})" > "$RUNNER_TEMP/time-peer.log" 2>&1 &
          peer_pid=$!
          trap 'kill "$http_pid" "$peer_pid"' EXIT
          node qa/stock-sets.cjs --time-battle
  pack-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Play a three-dog relay and review the team scorecard
        run: |
          node --test qa/pack-relay.cjs qa/cup-relay.cjs
          node --test qa/runoff-trump.cjs
          node --test qa/fetch-catch.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/relay-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/stock-sets.cjs --pack-relay
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/cup-relay.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/fetch-catch.js
          NODE_PATH="$RUNNER_TEMP/df3/node_modules" node qa/browser/runoff-trump.js
  versus-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Save, share and play custom rulesets in couch and private WebRTC fights
        run: |
          node --test qa/versus-rules.cjs qa/local-tournament.cjs
          npm install --prefix "$RUNNER_TEMP/df3" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1 peer@1.0.2
          export NODE_PATH="$RUNNER_TEMP/df3/node_modules"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/rules-http.log" 2>&1 &
          server_pid=$!
          node -e "require('peer').PeerServer({host:'127.0.0.1',port:9001,path:'/df3'})" > "$RUNNER_TEMP/rules-peer.log" 2>&1 &
          peer_pid=$!
          trap 'kill "$server_pid" "$peer_pid"' EXIT
          node qa/stock-sets.cjs --rulesets
          node qa/stock-sets.cjs --friend-rules
          node qa/browser/local-tournament.js
          node qa/browser/matchup-card.js
      - name: Save tournament screen previews
