<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#252337" />
    <meta
      name="description"
      content="Play The Last Dispatch, a side-scrolling dog adventure, or battle for the Golden Tennis Ball in solo, local versus, and training."
    />
    <title>Dog Fight 3 · Backyard Brawl</title>
    <link rel="icon" href="./assets/favicon.png" type="image/png" />
    <link rel="preload" href="./assets/brawl-pixel.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="./style.css?v=screen-1" />
    <link rel="stylesheet" href="./dispatch.css?v=widefilm-1" />
    <link rel="stylesheet" href="./screen.css?v=widefilm-1" />
    <script defer src="./fighters-art.js?v=dispatch-1"></script>
    <script defer src="./arena-art.js?v=screen-1"></script>
    <script defer src="./engine.js?v=dispatch-1"></script>
    <script defer src="./render.js?v=screen-1"></script>
    <script defer src="./dispatch-script.js?v=dispatch-1"></script>
    <script defer src="./dispatch-actors.js?v=dispatch-1"></script>
    <script defer src="./yard-art.js?v=screen-1"></script>
    <script defer src="./dispatch-covers.js?v=cinema-1"></script>
    <script defer src="./film-opening.js?v=widefilm-1"></script>
    <script defer src="./film-rescue.js?v=widefilm-1"></script>
    <script defer src="./film-boss.js?v=widefilm-1"></script>
    <script defer src="./film-ending.js?v=widefilm-1"></script>
    <script defer src="./dispatch-film.js?v=widefilm-1"></script>
    <script defer src="./dispatch-run.js?v=screen-1"></script>
    <script defer src="./dispatch-view.js?v=screen-1"></script>
    <script defer src="./app.js?v=widefilm-1"></script>
  </head>
  <body class="menu-screen">
    <header class="topbar">
      <div class="shell bar-content">
        <img class="wordmark" src="./assets/wordmark.png" alt="Dog Fight 3" />
        <nav class="tools" aria-label="Game tools">
          <button
            id="sound"
            class="utility icon-button"
            type="button"
            aria-label="Mute sound"
            title="Mute sound"
          >
            <i data-icon="sound"></i>
          </button>
          <button id="controls" class="utility" type="button" aria-label="Controls">
            <i data-icon="keyboard"></i><span>Controls</span>
          </button>
          <button
            id="fullscreen"
            class="utility full-button"
            type="button"
            aria-label="Enter fullscreen"
            aria-keyshortcuts="F"
            title="Enter fullscreen (F)"
          >
            <i data-icon="expand"></i><span>Fullscreen</span>
          </button>
        </nav>
      </div>
    </header>
    <main class="shell">
      <section id="home" class="dispatch-board" aria-labelledby="home-heading">
        <div class="board-heading">
          <h1 id="home-heading">Main menu</h1>
          <span class="rail-rule" aria-hidden="true"></span>
        </div>
        <div class="home-grid">
          <button
            type="button"
            id="home-adventure"
            class="feature-ticket"
            aria-label="Adventure · The Last Dispatch"
          >
            <canvas id="title-cover" width="640" height="360" aria-hidden="true"></canvas>
            <span class="ticket-corner">Adventure</span>
            <span class="feature-caption"
              ><span><small>Chapter 01 · The Silent Yard</small><strong>The Last Dispatch</strong></span
              ><b>Story map</b></span
            >
          </button>
          <nav class="mode-rack" aria-label="Game modes">
            <button type="button" data-enter-mode="solo">
              <i data-icon="paw"></i><span><b>Solo fight</b><small>Take on the CPU</small></span>
            </button>
            <button type="button" data-enter-mode="local">
              <i data-icon="versus"></i
              ><span><b>Local versus</b><small>Two players on one screen</small></span>
            </button>
            <button type="button" data-enter-mode="training">
              <i data-icon="ledge"></i><span><b>Training</b><small>Free practice and drills</small></span>
            </button>
          </nav>
        </div>
        <div class="board-foot">
          <div class="ticket-tools">
            <button type="button" id="home-guide">Move list</button
            ><button type="button" id="home-options">Options</button>
          </div>
          <span class="menu-hint">↑ ↓ Choose &nbsp; Enter Select</span>
        </div>
      </section>
      <section id="dispatch-route" class="dispatch-board" aria-labelledby="route-title" hidden>
        <div class="board-heading">
          <h1 id="route-title">The Last Dispatch</h1>
          <button class="board-back" id="route-home" type="button">Main menu</button>
        </div>
        <div class="route-grid">
          <div class="route-print">
            <canvas
              id="route-cover"
              width="640"
              height="360"
              role="img"
              aria-label="Rail map of Parcel Alley, Sorting Bridge and Bell Depot"
            ></canvas>
            <div><span>Chapter 01</span><strong>The Silent Yard</strong></div>
          </div>
          <div class="route-manifest">
            <h2>Route sheet</h2>
            <ol id="route-stops"></ol>
            <div id="route-crew" class="route-crew" role="group" aria-label="Choose a runner"></div>
          </div>
        </div>
        <div class="board-foot">
          <div class="route-save"><strong id="route-progress"></strong><span id="route-marks"></span></div>
          <div class="route-actions">
            <button class="board-back" id="route-films" type="button">Cutscenes</button>
            <button class="dispatch-primary" id="dispatch-start" type="button">Begin chapter</button>
          </div>
        </div>
      </section>
      <section id="dispatch-story" class="dispatch-board story-board" aria-labelledby="story-title" hidden>
        <div class="film-heading">
          <h1 id="story-title"></h1>
          <button class="board-back" id="story-map" type="button">Route map</button>
        </div>
        <canvas id="story-cover" width="320" height="180" role="img" aria-describedby="story-text"></canvas>
        <div class="film-footer">
          <div class="film-caption" aria-live="polite" aria-atomic="true">
            <span id="story-speaker"></span>
            <p id="story-text"></p>
          </div>
          <div class="film-timeline" aria-hidden="true"><i id="film-progress"></i></div>
          <div class="film-controls">
            <button class="film-transport" id="film-pause" type="button">Pause</button>
            <span id="film-time" aria-hidden="true"></span>
            <div class="film-end-controls">
              <button type="button" class="board-back" id="story-skip">Skip scene</button>
              <button class="dispatch-primary" type="button" id="story-next">Next</button>
            </div>
          </div>
        </div>
      </section>
      <section id="lobby" class="cabinet" aria-label="Fighter select" hidden>
        <div class="selection-bar">
          <div class="select-title">
            <button id="lobby-home" class="utility" type="button">Main menu</button>
            <h1>Fighter select</h1>
          </div>
          <div class="mode-tabs" role="group" aria-label="Game mode">
            <button type="button" data-mode="solo" aria-pressed="true">Solo</button>
            <button type="button" data-mode="local" aria-pressed="false">Local versus</button>
            <button type="button" data-mode="training" aria-pressed="false">Training</button>
          </div>
        </div>
        <section class="versus-screen" aria-label="Matchup">
          <canvas id="preview" width="1200" height="370" role="img" aria-label="Matchup preview"></canvas>
          <img class="versus-mark" src="./assets/versus.png" alt="Versus" />
          <span class="stock-tag" id="rules-label"></span>
          <div id="slots" class="slots" role="group" aria-label="Choose whose fighter to change"></div>
        </section>
        <section class="selection-deck" aria-labelledby="picking">
          <div class="pick-title">
            <h2 id="picking">Choose for P1</h2>
            <span class="deck-rule" aria-hidden="true"></span>
            <button id="lobby-moves" class="utility move-link" type="button">Move list</button>
          </div>
          <div id="roster" class="roster" role="group" aria-label="Choose a fighter"></div>
          <div class="signature"><i data-icon="spark"></i><span id="signature"></span></div>
        </section>
        <div class="coin-panel">
          <button
            id="choose-stage"
            type="button"
            class="arena-control"
            aria-label="Change arena"
            title="Change arena"
          >
            <canvas id="stage-mini" width="96" height="54" aria-hidden="true"></canvas>
            <span><small>Arena</small><strong id="stage-title">Picnic Table</strong></span>
            <i data-icon="chevron"></i>
          </button>
          <div class="ball-control">
            <div>
              <button
                id="fetch-switch"
                class="switch"
                type="button"
                role="switch"
                aria-label="Fetch Ball"
                aria-checked="true"
              >
                <i data-icon="ball"></i><span>Fetch Ball</span><b class="toggle-value">On</b>
              </button>
              <button
                id="ball-info"
                class="info"
                type="button"
                aria-label="About the Fetch Ball"
                title="About the Fetch Ball"
              >
                <i data-icon="info"></i>
              </button>
            </div>
          </div>
          <button class="primary start" id="start" type="button">
            <i data-icon="play"></i><span>Start fight</span>
          </button>
        </div>
      </section>
      <section id="match" aria-label="Match" hidden>
        <div class="match-top">
          <div>
            <span class="mode-label" id="match-mode">Solo</span>
            <h1 id="match-stage">Picnic Table</h1>
          </div>
          <button id="pause" class="utility" type="button"><i data-icon="pause"></i>Pause</button>
        </div>
        <div class="play-window" id="play-window">
          <canvas
            id="game"
            width="1200"
            height="675"
            tabindex="-1"
            aria-label="Dog Fight 3 arena. Keyboard controls are available from the Controls button."
          ></canvas>
          <div id="hud" class="hud"></div>
          <div id="dispatch-hud" class="dispatch-hud" hidden>
            <div class="runner-meter">
              <img id="runner-portrait" alt="" />
              <div>
                <b id="runner-name"></b
                ><progress id="runner-health" max="64" value="64" aria-label="Runner stamina"></progress>
              </div>
            </div>
            <div id="machine-meter" class="machine-meter" hidden>
              <b id="machine-name"></b
              ><progress id="machine-health" max="84" value="84" aria-label="Machine stamina"></progress>
            </div>
            <span id="dispatch-notice" hidden></span>
          </div>
          <span id="grapple-prompt" role="status" hidden></span>
          <div class="training-readouts">
            <output id="launch-status" aria-label="Launch practice" aria-live="polite" hidden></output>
            <output id="wall-status" aria-label="Wall tech practice" aria-live="polite" hidden></output>
            <output id="shield-status" aria-label="Shield practice" aria-live="polite" hidden></output>
            <output id="air-status" aria-label="Air-dodge practice" aria-live="polite" hidden></output>
            <output id="roll-status" aria-label="Ledge roll practice" aria-live="polite" hidden></output>
            <output id="trump-status" aria-label="Contested ledge" aria-live="polite" hidden></output>
            <output id="training-move" aria-label="Last move" hidden></output>
            <span id="training-charge" hidden></span>
            <output id="training-combo" aria-label="Last combo" hidden></output>
          </div>
          <div id="countdown" class="countdown" aria-hidden="true"></div>
        </div>
        <div id="dispatch-orders" class="dispatch-orders" hidden>
          <strong id="dispatch-objective" role="status"></strong><span id="dispatch-marks"></span>
        </div>
        <div class="touch-pad" aria-label="Touch controls">
          <div class="dpad">
            <button type="button" data-touch="up-left" aria-label="Aim up and left">↖</button
            ><button type="button" data-touch="up" aria-label="Aim up">▲</button
            ><button type="button" data-touch="up-right" aria-label="Aim up and right">↗</button
            ><button type="button" data-touch="left" aria-label="Move left">◀</button
            ><button type="button" data-touch="neutral" aria-label="Center aim">•</button
            ><button type="button" data-touch="right" aria-label="Move right">▶</button
            ><button type="button" data-touch="down-left" aria-label="Aim down and left">↙</button
            ><button type="button" data-touch="down" aria-label="Aim down">▼</button
            ><button type="button" data-touch="down-right" aria-label="Aim down and right">↘</button>
          </div>
          <div class="touch-actions">
            <button type="button" data-touch="jump">Jump</button
            ><button type="button" data-touch="attack">Attack</button
            ><button type="button" data-touch="special">Special</button
            ><button type="button" data-touch="shield">Shield</button
            ><button type="button" data-touch="grab">Grab</button
            ><button type="button" data-touch="smash">Smash</button>
          </div>
        </div>
        <p id="recovery-tip" hidden></p>
        <div id="training-tools" class="training-tools" hidden>
          <label for="dummy-damage"
            >Dummy damage <output id="damage-output" for="dummy-damage">0%</output></label
          ><input
            id="dummy-damage"
            aria-label="Dummy damage"
            type="range"
            min="0"
            max="200"
            value="0"
            step="5"
          />
          <button id="reset-training" type="button" class="utility">
            <i data-icon="reset"></i>Reset positions
          </button>
          <button id="ledge-training" type="button" class="utility">
            <i data-icon="ledge"></i>Left ledge
          </button>
          <button id="ledge-right" type="button" class="utility"><i data-icon="ledge"></i>Right ledge</button>
          <button id="ledge-attack-training" type="button" class="utility">Practice ledge attack</button>
          <button id="ledge-roll-training" type="button" class="utility">Ledge roll practice</button>
          <span id="roll-patterns" role="group" aria-label="Ledge roll drill" hidden>
            <button id="roll-guard" type="button" class="utility" aria-pressed="true">Close guard</button>
            <button id="roll-read" type="button" class="utility" aria-pressed="false">Read the roll</button>
            <button id="roll-side" type="button" class="utility">Switch ledge</button>
          </span>
          <button id="trump-training" type="button" class="utility">Contested ledge</button>
          <span id="trump-patterns" role="group" aria-label="Contested ledge practice" hidden>
            <button id="trump-take" type="button" class="utility" aria-pressed="true">Take the ledge</button>
            <button id="trump-defend" type="button" class="utility" aria-pressed="false">
              Defend the ledge
            </button>
            <button id="trump-side" type="button" class="utility">Switch ledge</button>
          </span>
          <button id="launch-training" type="button" class="utility">Launch practice</button>
          <button id="wall-training" type="button" class="utility">Wall tech practice</button>
          <span id="wall-patterns" role="group" aria-label="Wall tech drill" hidden>
            <button id="wall-retry" type="button" class="utility">Retry kick</button>
            <button id="wall-side" type="button" class="utility">Switch wall</button>
          </span>
          <button id="shield-training" type="button" class="utility">Shield practice</button>
          <span id="shield-patterns" role="group" aria-label="Dummy action" hidden>
            <button id="shield-strike" type="button" class="utility" aria-pressed="true">Strike</button>
            <button id="shield-grab" type="button" class="utility" aria-pressed="false">Grab</button>
          </span>
          <button id="air-dodge-training" type="button" class="utility">Air-dodge practice</button>
          <span id="air-patterns" role="group" aria-label="Air-dodge drill" hidden>
            <button id="air-neutral" type="button" class="utility" aria-pressed="true">In place</button>
            <button id="air-edge" type="button" class="utility" aria-pressed="false">At the ledge</button>
            <button id="air-side" type="button" class="utility" hidden>Switch ledge</button>
          </span>
          <button id="training-moves" type="button" class="utility">Move list</button>
        </div>
        <div class="play-hints">
          <span><kbd>A</kbd><kbd>D</kbd> Move</span><span><kbd>Space</kbd> Jump</span
          ><span><kbd>J</kbd> Attack</span><span><kbd>I</kbd> Smash</span><span><kbd>K</kbd> Special</span
          ><span><kbd>L</kbd> Shield</span><span><kbd>U</kbd> Grab</span><span><kbd>Esc</kbd> Pause</span>
        </div>
      </section>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-inner">
        <div class="dialog-heading">
          <h2 id="dialog-title"></h2>
          <button id="dialog-close" type="button" class="utility icon-button" aria-label="Close dialog">
            <i data-icon="close"></i>
          </button>
        </div>
        <div id="dialog-body"></div>
      </div>
    </dialog>
    <div id="announce" role="status" aria-live="polite" class="sr-only"></div>
    <noscript>Enable JavaScript to play Dog Fight 3.</noscript>
  </body>
</html>
